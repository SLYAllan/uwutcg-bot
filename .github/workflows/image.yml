name: Image

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/slyallan/uwutcg-bot
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
      - name: Le compose de Dokploy passe chaque variable que lit le bot
        run: |
          # Variables lues par bot/config.py, sauf les chemins internes à l'image : passés
          # vides, ils écraseraient leurs valeurs par défaut.
          attendu=$(grep -hoE 'alias="[A-Z0-9_]+"' bot/config.py | cut -d'"' -f2 \
            | grep -vxE 'DB_PATH|KNOWLEDGE_DIR|PRICING_CONFIG' | sort -u)
          config=$(docker compose -f compose.dokploy.yaml config --format json)
          diff <(echo "$attendu") <(jq -r '.services.bot.environment | keys[]' <<< "$config" | sort)
          jq -e '.services.bot.image == "ghcr.io/slyallan/uwutcg-bot:master"' <<< "$config"
          jq -e '.volumes["uwutcg-bot-data"].external == true' <<< "$config"
          jq -e '.services.bot.networks | has("dokploy-network")' <<< "$config"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: uwutcg-bot:essai
          labels: org.opencontainers.image.source=https://github.com/SLYAllan/uwutcg-bot
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Les tests passent dans l'image
        # .dockerignore laisse tests/ hors de l'image de prod : on le monte le temps du
        # contrôle, pour que le code tourne avec le Python, les paquets et le Chromium
        # de l'image.
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" uwutcg-bot:essai python -m pytest -q
      - if: env.PUBLIER == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication
        if: env.PUBLIER == 'true'
        run: |
          for tag in "${{ github.sha }}" master; do
            docker tag uwutcg-bot:essai "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
